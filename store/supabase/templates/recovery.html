<!-- NÉVORA V2 reference template: V1 has no password recovery route. Links go to {{ .SiteURL }}/auth/confirm.
     Paste the same template into the hosted dashboard: Authentication → Email Templates → Reset password. -->
<div style="background:#F8F5EF;padding:32px 16px;font-family:Helvetica,Arial,sans-serif;color:#34251F">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #ddd2c4;padding:32px">
    <p style="margin:0 0 24px;font-family:Georgia,serif;font-size:24px;letter-spacing:4px">NÉVORA</p>
    <h1 style="margin:0 0 12px;font-family:Georgia,serif;font-weight:normal;font-size:22px">Reset your password</h1>
    <p style="margin:0 0 24px;line-height:1.6">We received a request to reset the password for your NÉVORA account. Choose a new password with the link below.</p>
    <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery" style="display:inline-block;background:#34251F;color:#F8F5EF;padding:12px 24px;text-decoration:none;font-weight:bold">Choose a new password</a></p>
    <p style="margin:0;font-size:13px;line-height:1.6;color:#6a574c">If you didn't ask for this, you can ignore this email and your password stays the same. The link works once and expires after an hour.</p>
  </div>
</div>
